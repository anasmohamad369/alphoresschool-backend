# Actuator (used by Docker health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.health.redis.enabled=false

# Redis is on the classpath but unused; exclude so health checks pass without a Redis server
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# File Management Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.root=/opt/uploads

# CORS Config
app.cors.allowed-origins=http://localhost:3000,https://lumo-teacher-panel.vercel.app

# OpenRouter API Config (set OPENROUTER_API_KEY in .env / hosting env — never commit the key)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.model=${OPENROUTER_API_MODEL:openrouter/free}
openrouter.api.max-tokens=${OPENROUTER_API_MAX_TOKENS:1024}

